[package]
name = "peek-processes"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A peek plugin: what is running on a machine, live, and ending it."
publish = false

# A crate of its own, not part of peek's: a plugin knows peek only by the
# messages on its pipe.
[workspace]

[dependencies]
serde_json = "1.0.154"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Wdk_System_SystemInformation", "Win32_Foundation", "Win32_Security", "Win32_System_RemoteDesktop", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
