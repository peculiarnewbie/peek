[package]
name = "peek"
version = "0.2.2"
edition = "2024"
license = "MIT"

[dependencies]
peek-files = { path = "apps/files" }
axum = { version = "0.8.9", features = ["ws"] }
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
getrandom = "0.4.3"
if-addrs = "0.15.0"
jpeg-encoder = { version = "0.7.1", features = ["simd"] }
qrcode = { version = "0.14.1", default-features = false }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }

[target."cfg(windows)".dependencies]
clipboard-win = "5.4.3"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Gdi", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_System_Registry", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Power", "Win32_System_ProcessStatus", "Win32_System_RemoteDesktop", "Win32_System_Services", "Win32_System_StationsAndDesktops", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[target."cfg(target_os = \"linux\")".dependencies]
libc = "0.2"
wayland-client = "0.31"
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[dev-dependencies]
# Tests check src/webp.rs against it, byte for byte, and decode with it.
image-webp = "0.2.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# Capture and JPEG encoding are unusable unoptimised, even while developing.
[profile.dev]
opt-level = 2
